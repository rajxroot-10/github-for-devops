name: Build Shivshambho Self Drive APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: ShivshambhoSelfDriveApp/ShivshambhoSelfDriveApp/android
        run: |
          chmod +x gradlew || true
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.13
          fi
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shivshambho-Self-Drive-APK
          path: ShivshambhoSelfDriveApp/ShivshambhoSelfDriveApp/android/app/build/outputs/apk/debug/*.apk
